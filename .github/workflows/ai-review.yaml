---
name: AI Review
on:
  # checkov:skip=CKV_GHA_7: dispatch only pipeline
  workflow_dispatch:
    inputs:
      run:
        description: "run — full review (inline + summary)"
        type: boolean
        default: false
      run-inline:
        description: "run-inline — inline code review comments"
        type: boolean
        default: false
      run-context:
        description: "run-context — context review"
        type: boolean
        default: true
      run-summary:
        description: "run-summary — summary review"
        type: boolean
        default: false
      run-inline-reply:
        description: "run-inline-reply — reply to inline comments"
        type: boolean
        default: false
      run-summary-reply:
        description: "run-summary-reply — reply to summary comments"
        type: boolean
        default: false
      clear-inline:
        description: "clear-inline — remove AI inline comments"
        type: boolean
        default: false
      clear-summary:
        description: "clear-summary — remove AI summary comments"
        type: boolean
        default: false
      llm-api-url:
        description: "custom API url"
        type: string
      llm-api-type:
        description: "custom API type"
        type: string
      llm-api-model:
        description: "custom API model"
        type: string
      llm-api-token:
        description: "custom API token"
        type: string
# jscpd:ignore-start
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
          persist-credentials: false
      - name: Run AI review
        # jscpd:ignore-end
        uses: megalomania428/github-actions/review-simple@master
        with:
          # jscpd:ignore-start
          llm_api_url: ${{ inputs.llm-api-url || secrets.LLM_API_URL }}
          llm_api_model: ${{ inputs.llm-api-model || secrets.LLM_API_MODEL ||
            'co-reviewer' }}
          llm_api_key: "${{ inputs.llm-api-token ||
            !inputs.llm-api-url && secrets.LLM_API_KEY || 'dummy' }}"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # jscpd:ignore-end
          llm_api_type: ${{ inputs.llm-api-type || 'OPENAI' }}
          run: ${{ inputs.run }}
          run_inline: ${{ inputs.run-inline }}
          run_context: ${{ inputs.run-context }}
          run_summary: ${{ inputs.run-summary }}
          run_inline_reply: ${{ inputs.run-inline-reply }}
          run_summary_reply: ${{ inputs.run-summary-reply }}
          clear_inline: ${{ inputs.clear-inline }}
          clear_summary: ${{ inputs.clear-summary }}
